[package]
name = "reverse-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1"] }
serial_test = "4.0.1"
