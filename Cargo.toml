[package]
name = "reverse-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "server-graceful"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1"] }
serial_test = "4.0.1"
